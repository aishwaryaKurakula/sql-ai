name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []  # runs after CI passes on same push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Copy build to server
        run: |
          rsync -avz --delete \
            backend/dist/ \
            ubuntu@${{ secrets.SERVER_IP }}:/app/backend/dist/

      - name: Copy package.json to server
        run: |
          scp backend/package.json \
            ubuntu@${{ secrets.SERVER_IP }}:/app/backend/package.json

      - name: Install production deps + restart PM2
        run: |
          ssh ubuntu@${{ secrets.SERVER_IP }} '
            cd /app/backend &&
            npm ci --only=production &&
            npx prisma migrate deploy &&
            pm2 reload ecosystem.config.js --env production &&
            pm2 save
          '
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Smoke test
        run: |
          sleep 5
          curl --fail https://${{ secrets.DOMAIN_NAME }}/health || exit 1

      - name: Notify success
        run: echo "Deployed successfully to production"